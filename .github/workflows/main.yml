name: Run News Scraper

on:
schedule:
- cron: "0 2 * * *"   # daily at 02:00 UTC
workflow_dispatch:

jobs:
scrape:
runs-on: ubuntu-latest

```
steps:
  - name: 📥 Checkout repo
    uses: actions/checkout@v4

  - name: 🐍 Setup Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.10"

  - name: 📦 Install dependencies
    run: |
      python -m pip install --upgrade pip
      pip install -r requirements.txt

  - name: 📁 Create Data folder
    run: mkdir -p Data

  - name: ▶️ Run scraper
    run: |
      python main.py

  - name: 📦 Move DB files to Data folder
    run: |
      mv *.db Data/ || true

  - name: 🔄 Commit and push DB files
    run: |
      git config --global user.name "github-actions"
      git config --global user.email "actions@github.com"
      git add Data/*.db || true
      git commit -m "Auto update DB files" || echo "No changes to commit"
      git push
```
