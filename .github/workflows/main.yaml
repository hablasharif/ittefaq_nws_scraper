name: Ittefaq Scraper

on:
  # Runs daily at 03:00 UTC
  schedule:
    - cron: "0 3 * * *"

  # Manual trigger — no inputs, date_range is always read from scraper.py CONFIG
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # needed to push .db files back to the repo

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 2. Python setup ──────────────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── 3. Run scraper (date_range comes from scraper.py CONFIG) ─────────────
      - name: Run scraper
        run: python scraper.py

      # ── 4. Show DB stats in the Actions log ──────────────────────────────────
      - name: Show DB stats
        run: |
          echo "=== DB files in ./data/ ==="
          ls -lh data/*.db 2>/dev/null || echo "(none)"
          python - <<'EOF'
          import sqlite3, os, glob
          files = sorted(glob.glob("data/*.db"))
          total = 0
          for f in files:
              with sqlite3.connect(f) as c:
                  n = c.execute("SELECT COUNT(*) FROM news").fetchone()[0]
              sz = os.path.getsize(f) / 1024 / 1024
              print(f"  {os.path.basename(f):40s}  {n:>8,} URLs  {sz:.1f} MB")
              total += n
          print(f"\n  {'TOTAL':40s}  {total:>8,} URLs")
          EOF

      # ── 5. Commit & push .db files back to the repo ───────────────────────────
      - name: Commit updated DB files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/*.db
          git add data/failed_urls.txt 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "Nothing changed — skipping commit."
          else
            STAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
            git commit -m "chore: scraper run $STAMP"
            git push
          fi
